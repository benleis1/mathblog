# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Math Off The Grid
tagline: My mathematical reflections
description: >- # this means to ignore newlines until "baseurl:"
  A blog exploring mathematical concepts and problem-solving techniques for math circles aimed at middle school and highschool
baseurl: "/mathblog" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
locale: "en-US"

# Site logo
logo: "/assets/img/icos1.jpg"

# Author information
author:
  name: Benjamin Leis
  bio: "My mathematical reflections"
  location: "Seattle"
  email: benleis1@gmail.com
  links:
    - label: "Mastodon"
      icon: "fab fa-fw fa-mastodon"
      url: "https://mathstodon.xyz/@benleis"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/benleis1"

# Build settings
theme: minimal-mistakes-jekyll

# Minimal Mistakes settings
minimal_mistakes_skin: "default" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Reading Files
include:
  - _pages

# Pagination
paginate: 10
paginate_path: /page:num/
show_excerpts: true

# Excerpt settings
# excerpt_separator: "\n\n"

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-feed
  - jekyll-include-cache

# Search
search: true
search_full_content: true

jekyll-archives:
  enabled:
    - tags
  layouts:
    tag: archive-taxonomy
  permalinks:
    tag: /tags/:name/

# Tag archive pages
tag_archive:
  type: jekyll-archives
  path: /tags/

# Social Sharing
social:
  type: Person
  name: Benjamin Leis
  links:
    - "https://github.com/benleis1"
    - "https://mathstodon.xyz/@benleis"

# Social share buttons (only Mastodon and Bluesky)
social_share:
  - mastodon
  - bluesky

# Site Footer
footer:
  links:
    - label: "RSS Feed"
      icon: "fas fa-fw fa-rss-square"
      url: "/mathblog/feed.xml"
    - label: "Mastodon"
      icon: "fab fa-fw fa-mastodon"
      url: "https://mathstodon.xyz/@benleis"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/benleis1"

# Default settings
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: true
      share: true
      related: true
      toc: true
      toc_sticky: true
      show_date: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      wide: true


# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Timezone
timezone: America/New_York

# Kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter_opts:
    disable: true

# Repository (needed for Minimal Mistakes)
repository: benleis1/mathblog

# Comments
comments:
  provider: "utterances"
  utterances:
    repo: "benleis1/mathblog"
    issue-term: "pathname"
    theme: "github-light"

# hookup google analytics
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-RZFBPDGYMB" 
    anonymize_ip: true           # Optional: for better privacy compliance
